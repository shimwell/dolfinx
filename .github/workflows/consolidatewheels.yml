name: Demonstrate consolidatewheels limitation

on:
  workflow_dispatch:
  push:
    branches:
      - shimwell/consolidate-wheels-experiment

jobs:
  test:
    name: Test real Basix and DOLFINx wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test published wheel artifacts
        run: |
          python -m pip install consolidatewheels==0.5 wheel
          curl -LO https://shimwell.github.io/wheels/fenics-basix/fenics_basix-0.12.0.dev0-cp312-abi3-manylinux_2_34_x86_64.whl
          curl -LO https://shimwell.github.io/wheels/fenics-dolfinx/fenics_dolfinx-0.12.0.dev0-cp312-abi3-manylinux_2_34_x86_64.whl

          python - <<'PY'
          import pathlib
          import subprocess
          import tempfile

          from consolidatewheels.consolidate_linux import buildlibmap

          wheels = sorted(pathlib.Path.cwd().glob("fenics_*.whl"))
          result = subprocess.run(
              ["consolidatewheels", *map(str, wheels), "--dest", "output"],
              capture_output=True,
              check=False,
              text=True,
          )
          print(result.stdout)
          print(result.stderr)
          assert result.returncode != 0
          assert "Library libopenblas-r0.so appears multiple times" in result.stderr

          with tempfile.TemporaryDirectory() as root:
              subprocess.run(
                  ["wheel", "unpack", str(wheels[1]), "-d", root], check=True
              )
              unpacked = next(pathlib.Path(root).iterdir())
              library_map = buildlibmap([unpacked])
              assert not any("dolfinx" in name for name in library_map)

          print("EXPECTED LIMITATION: the real wheel pair is rejected because")
          print("both wheels contain the same auditwheel-managed OpenBLAS library.")
          print("The versioned libdolfinx library is also absent from the map.")
          PY
