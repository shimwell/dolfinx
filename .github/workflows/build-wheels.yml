name: Build wheels

# By default this action does not push to test or production PyPI.  The wheels
# are available as an artifact that can be downloaded and tested locally.

on:
  workflow_dispatch:
    inputs:
      dolfinx_ref:
        description: "dolfinx git ref to checkout"
        default: "main"
        type: string

      build_fenicsx_stack:
        description: "Build wheels for whole FEniCSx stack"
        default: false
        type: boolean

      basix_ref:
        description: "basix git ref to checkout"
        default: "main"
        type: string

      ufl_ref:
        description: "ufl git ref to checkout"
        default: "main"
        type: string

      ffcx_ref:
        description: "ffcx git ref to checkout"
        default: "main"
        type: string

      adios2_ref:
        description: "ADIOS2 git ref to build MPI wheels from"
        default: "5a47aeefd748a086dc3a85d21fb88c1ae6aa2b4b"
        type: string

  workflow_call:
    inputs:
      dolfinx_ref:
        description: "dolfinx git ref to checkout"
        default: "main"
        type: string

      build_fenicsx_stack:
        description: "Build wheels for entire FEniCSx stack"
        default: false
        type: boolean

      basix_ref:
        description: "basix git ref to checkout"
        default: "main"
        type: string

      ufl_ref:
        description: "ufl git ref to checkout"
        default: "main"
        type: string

      ffcx_ref:
        description: "ffcx git ref to checkout"
        default: "main"
        type: string

      adios2_ref:
        description: "ADIOS2 git ref to build MPI wheels from"
        default: "5a47aeefd748a086dc3a85d21fb88c1ae6aa2b4b"
        type: string

jobs:
  build_adios2_wheels:
    name: Build MPI ADIOS2 wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_build: cp312-manylinux_x86_64
          - os: ubuntu-24.04-arm
            cibw_build: cp312-manylinux_aarch64

    steps:
      - uses: actions/setup-python@v7

      - name: Install Python dependencies
        run: python -m pip install cibuildwheel cmake

      - name: Checkout ADIOS2
        uses: actions/checkout@v7
        with:
          repository: shimwell/ADIOS2
          path: adios2
          ref: ${{ inputs.adios2_ref || github.event.inputs.adios2_ref }}
          fetch-depth: 0

      - name: Generate ADIOS2 version
        working-directory: adios2
        run: cmake -P scripts/ci/gh-actions/config/adios-version.cmake

      - name: Build and test MPI ADIOS2 wheel
        run: python -m cibuildwheel --output-dir wheelhouse/ adios2
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_LINUX: native
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_34_x86_64:latest
          CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_34_aarch64:latest
          CIBW_BEFORE_ALL_LINUX: >
            dnf -y install libcurl-devel openssl-devel libsodium-devel
          CIBW_BEFORE_BUILD_LINUX: >
            pip install build scikit-build-core cmake ninja numpy setuptools_scm
            mpich mpi4py
          CIBW_BUILD_FRONTEND: "build; args: -nx"
          CIBW_CONFIG_SETTINGS_LINUX: >
            cmake.define.ADIOS2_USE_MPI=ON
            cmake.build-type=Release
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair --exclude libmpi.so* -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: mpich mpi4py
          CIBW_TEST_COMMAND_LINUX: >
            python -c "import adios2; from mpi4py import MPI; assert adios2.bindings.is_built_with_mpi; adios2.bindings.ADIOS(MPI.COMM_WORLD)" &&
            mpiexec -n 2 python -c "import adios2; from mpi4py import MPI; assert adios2.bindings.is_built_with_mpi; adios2.bindings.ADIOS(MPI.COMM_WORLD)"

      - name: Upload ADIOS2 wheelhouse artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheelhouse-adios2-${{ matrix.os }}
          path: wheelhouse/*

  build_wheels:
    name: Build wheels
    needs: build_adios2_wheels
    runs-on: ${{ matrix.os }}
    # GitHub kills a job at 360 min with no usable diagnostics. Stop
    # short of that so a hang reports as a clean failure.
    timeout-minutes: 300
    strategy:
      # Iterating on this branch: let every platform report rather than
      # cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_build: cp312-manylinux_x86_64
          - os: ubuntu-24.04-arm
            cibw_build: cp312-manylinux_aarch64
          - os: macos-15
            cibw_build: cp312-macosx_arm64

    env:
      CIBW_BUILD: ${{ matrix.cibw_build }}
      CIBW_BUILD_VERBOSITY: 1
      CIBW_ENVIRONMENT: PIP_INDEX_URL="file:///project/simple" PIP_EXTRA_INDEX_URL="https://pypi.org/simple"
      CIBW_ARCHS_LINUX: native
      CIBW_ARCHS_MACOS: native
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_34_x86_64:latest
      CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_34_aarch64:latest

    steps:
      - uses: actions/setup-python@v7

      - name: Install Python dependencies
        run: python -m pip install cibuildwheel simple503 build

      - name: Download ADIOS2 wheels
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        with:
          pattern: wheelhouse-adios2-*
          path: adios2-wheels/
          merge-multiple: true

      - name: Checkout UFL
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: FEniCS/ufl
          path: ufl
          ref: ${{ github.event.inputs.ufl_ref }}

      - name: Build UFL wheel
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        run: |
          python -m build -o wheelhouse/ ufl/

      - name: Checkout FFCx
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: FEniCS/ffcx
          path: ffcx
          ref: ${{ github.event.inputs.ffcx_ref }}

      - name: Build FFCx wheel
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        run: |
          python -m build -o wheelhouse/ ffcx/

      - name: Checkout Basix
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: FEniCS/basix
          path: basix
          ref: ${{ github.event.inputs.basix_ref }}

      - name: Build Basix wheel
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        working-directory: basix/
        run: |
          python -m cibuildwheel --output-dir ../wheelhouse/ .

      - name: Make temporary simple503 repo directories
        run: |
          mkdir -p wheelhouse/ simple/ petsc-wheels/
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp adios2-wheels/*.whl simple/
          fi

      - name: Add wheels to simple503 repository (if built)
        if: ${{ github.event.inputs.build_fenicsx_stack == 'true' }}
        run: cp wheelhouse/* simple/

      - name: Index simple503 repository (Linux)
        if: runner.os == 'Linux'
        run: python -m simple503 --base-url file:///project/simple simple/

      - name: Index simple503 repository (macOS)
        if: runner.os == 'macOS'
        run: python -m simple503 --base-url "file://${GITHUB_WORKSPACE}/simple" simple/

      - name: Checkout DOLFINx
        uses: actions/checkout@v7
        with:
          path: dolfinx
          ref: ${{ github.event.inputs.dolfinx_ref }}

      # fenics-ffcx and fenics-basix are required by DOLFINx C++ build
      # mpi4py and petsc4py are build_requirements of DOLFINx Python
      - name: Build DOLFINx wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse/ dolfinx/python
        env:
          CIBW_ENVIRONMENT_LINUX: PIP_EXTRA_INDEX_URL=file:///project/simple
          # When using Homebrew the packaged .so are always built on the macOS
          # SDK version of the current system. Consequently
          # MACOSX_DEPLOYMENT_TARGET must always be set to the SDK version of
          # the current system.
          CIBW_ENVIRONMENT_MACOS: >
            PIP_EXTRA_INDEX_URL=file://$GITHUB_WORKSPACE/simple
            MACOSX_DEPLOYMENT_TARGET=$(xcrun --sdk macosx --show-sdk-version)
            CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/dolfinx-install:$(brew --prefix)
          # TODO revert to the PyPI petsc and petsc4py once 3.26 is released.
          # petsc and petsc4py are built from petsc main below, rather than
          # installed from PyPI, purely to pick up petsc!9573. Without it
          # petsc4py.get_config() returns the PETSC_DIR recorded when the wheel
          # was built, a pip build isolation directory that no longer exists, so
          # dolfinx.fem.petsc.get_petsc_lib() cannot find libpetsc and
          # test_petsc_custom_assembler.py fails to import. The fix is merged to
          # petsc main and is in the 3.26 milestone, so once 3.26 is on PyPI
          # this should go back to `pip wheel petsc` and `pip wheel petsc4py`,
          # the petsc main clone should be dropped, and the --pre flags on the
          # clean environment tests below are no longer needed.
          # https://gitlab.com/petsc/petsc/-/merge_requests/9573
          CIBW_BEFORE_BUILD_LINUX: >
            dnf -y update &&
            dnf install -y dnf-plugins-core &&
            dnf install -y epel-release &&
            /usr/bin/crb enable &&
            dnf -y update &&
            dnf -y install git make ninja-build openblas-devel pugixml-devel \
              spdlog-devel zlib-devel &&
            pip install mpich mpi4py &&
            MPI_PREFIX=$(python -c "import sys; print(sys.prefix)") &&
            curl -L https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz | tar -xz &&
            (cd boost_1_92_0/ && ./bootstrap.sh --prefix=/usr/local &&
              ./b2 -d0 --prefix=/usr/local --with-headers install) &&
            curl -L https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6.tar.gz | tar -xz &&
            cmake -G Ninja -S hdf5-1.14.6 -B hdf5-build-dir/ \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DBUILD_TESTING=OFF \
              -DHDF5_ENABLE_PARALLEL=ON \
              -DHDF5_BUILD_TOOLS=OFF \
              -DHDF5_BUILD_EXAMPLES=OFF \
              -DHDF5_BUILD_UTILS=OFF \
              -DHDF5_BUILD_HL_LIB=OFF \
              -DMPI_HOME=$MPI_PREFIX &&
            cmake --build hdf5-build-dir/ &&
            cmake --install hdf5-build-dir/ &&
            mkdir -p scotch && curl -L https://gitlab.inria.fr/scotch/scotch/-/archive/v7.0.12/scotch-v7.0.12.tar.bz2 | tar -xj --strip-components=1 -C scotch &&
            cmake -G Ninja -S scotch/ -B scotch-build-dir/ \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_PREFIX_PATH=$MPI_PREFIX \
              -DBUILD_LIBSCOTCHMETIS=ON \
              -DINSTALL_METIS_HEADERS=ON &&
            cmake --build scotch-build-dir/ &&
            cmake --install scotch-build-dir/ &&
            git clone --branch v9.2.1 --single-branch https://github.com/xiaoyeli/superlu_dist.git &&
            cmake -G Ninja -S superlu_dist/ -B superlu_dist-build-dir/ \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_PREFIX_PATH=$MPI_PREFIX \
              -DTPL_ENABLE_PARMETISLIB=OFF \
              -DXSDK_ENABLE_Fortran=OFF \
              -DTPL_ENABLE_LAPACKLIB=ON &&
            cmake --build superlu_dist-build-dir/ &&
            cmake --install superlu_dist-build-dir/ &&
            curl -L https://github.com/ornladios/ADIOS2/archive/refs/tags/v2.12.1.tar.gz | tar -xz &&
            cmake -G Ninja -S ADIOS2-2.12.1 -B adios2-build-dir/ \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DBUILD_TESTING=OFF \
              -DADIOS2_USE_MPI=ON \
              -DADIOS2_USE_Fortran=OFF \
              -DADIOS2_USE_Python=OFF \
              -DADIOS2_USE_HDF5=OFF \
              -DADIOS2_BUILD_EXAMPLES=OFF \
              -DMPI_HOME=$MPI_PREFIX &&
            cmake --build adios2-build-dir/ &&
            cmake --install adios2-build-dir/ &&
            printf '/usr/local/lib64\n/usr/local/lib\n' > /etc/ld.so.conf.d/dolfinx-wheel.conf && ldconfig &&
            pip -v install $(python -c "import tomllib; deps=tomllib.load(open('/project/dolfinx/python/pyproject.toml','rb'))['project']['dependencies']; print(' '.join(x for x in deps if 'fenics-basix' in x or 'fenics-ffcx' in x))") &&
            pip -v install scikit-build-core nanobind &&
            git clone --depth 1 --branch main https://gitlab.com/petsc/petsc.git /petsc-src &&
            PETSC_CONFIGURE_OPTIONS="--with-debugging=0 --with-fc=0
            --download-f2cblaslapack --with-superlu_dist-dir=/usr/local"
            pip -v wheel /petsc-src -w /petsc-wheels &&
            pip install --quiet wheel &&
            auditwheel repair --exclude libmpi.so* -w /petsc-repaired /petsc-wheels/petsc-*.whl &&
            rm /petsc-wheels/petsc-*.whl &&
            wheel unpack /petsc-repaired/petsc-*.whl -d /petsc-unpacked &&
            find /petsc-unpacked -name "libpetsc.so.*" -type f | xargs -I% patchelf --add-rpath '$ORIGIN/../../../..' % &&
            wheel pack /petsc-unpacked/* -d /petsc-wheels &&
            pip -v install --no-index --find-links=/petsc-wheels petsc &&
            PETSC_DIR=$(python -c "import petsc; print(petsc.get_petsc_dir())")
            PIP_FIND_LINKS=/petsc-wheels PIP_PRE=1 pip -v wheel /petsc-src/src/binding/petsc4py -w /petsc-wheels &&
            pip -v install --no-index --find-links=/petsc-wheels petsc4py &&
            for PY in /opt/python/cp313-cp313 /opt/python/cp314-cp314; do
              PETSC_DIR=$(python -c "import petsc; print(petsc.get_petsc_dir())")
              PIP_FIND_LINKS=/petsc-wheels PIP_PRE=1 $PY/bin/pip wheel /petsc-src/src/binding/petsc4py -w /petsc-wheels || exit 1;
            done &&
            pip install patchelf wheel &&
            for W in /petsc-wheels/petsc4py-*.whl; do
              rm -rf /tmp/p4p && wheel unpack $W -d /tmp/p4p &&
              patchelf --set-rpath '$ORIGIN/../../petsc/lib' $(find /tmp/p4p -name 'PETSc*.so') &&
              rm $W && wheel pack /tmp/p4p/petsc4py-* -d /petsc-wheels || exit 1;
            done &&
            cmake -G Ninja -S dolfinx/cpp -B dolfinx-build-dir/ \
              -DPython3_EXECUTABLE=$(which python) \
              -DCMAKE_PREFIX_PATH="$MPI_PREFIX;/usr/local" \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DDOLFINX_ENABLE_SUPERLU_DIST=ON \
              -DDOLFINX_ENABLE_SCOTCH=ON \
              -DDOLFINX_ENABLE_ADIOS2=ON \
              -DDOLFINX_ENABLE_PARMETIS=OFF &&
            cmake --build dolfinx-build-dir/ &&
            cmake --install dolfinx-build-dir/ &&
            pip install pkgconfig &&
            pip wheel --no-build-isolation --no-binary scifem scifem -w /petsc-wheels --no-deps
            -Cwheel.py-api=cp312 &&
            for W in /petsc-wheels/scifem-*.whl; do
              rm -rf /scifem-repaired /tmp/sci &&
              auditwheel repair --exclude libdolfinx.so* --exclude libbasix.so* --exclude libmpi.so* -w /scifem-repaired $W &&
              rm $W && wheel unpack /scifem-repaired/scifem-*.whl -d /tmp/sci &&
              patchelf --add-rpath '$ORIGIN/../dolfinx/lib:$ORIGIN/../basix/lib:$ORIGIN/../../../..' $(find /tmp/sci -name '_scifem*.so') &&
              wheel pack /tmp/sci/scifem-* -d /petsc-wheels || exit 1;
            done
          CIBW_BEFORE_BUILD_MACOS: >
            brew install boost ninja openblas pkgconf pugixml spdlog &&
            pip install openmpi mpi4py &&
            MPI_PREFIX=$(python -c "import sys; print(sys.prefix)") &&
            curl -L https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.6/hdf5-1.14.6.tar.gz | tar -xz &&
            cmake -G Ninja -S hdf5-1.14.6 -B hdf5-build-dir/ \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DBUILD_TESTING=OFF \
              -DHDF5_ENABLE_PARALLEL=ON \
              -DHDF5_BUILD_TOOLS=OFF \
              -DHDF5_BUILD_EXAMPLES=OFF \
              -DHDF5_BUILD_UTILS=OFF \
              -DHDF5_BUILD_HL_LIB=OFF \
              -DMPI_HOME=$MPI_PREFIX &&
            cmake --build hdf5-build-dir/ &&
            sudo cmake --install hdf5-build-dir/ &&
            mkdir -p scotch && curl -L https://gitlab.inria.fr/scotch/scotch/-/archive/v7.0.12/scotch-v7.0.12.tar.bz2 | tar -xj --strip-components=1 -C scotch &&
            cmake -G Ninja -S scotch/ -B scotch-build-dir/ \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_PREFIX_PATH="$MPI_PREFIX;${CMAKE_PREFIX_PATH}" \
              -DBUILD_LIBSCOTCHMETIS=ON \
              -DINSTALL_METIS_HEADERS=ON &&
            cmake --build scotch-build-dir/ &&
            sudo cmake --install scotch-build-dir/ &&
            git clone --branch v9.2.1 --single-branch https://github.com/xiaoyeli/superlu_dist.git &&
            cmake -G Ninja -S superlu_dist/ -B superlu_dist-build-dir/ \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_PREFIX_PATH="$MPI_PREFIX;${CMAKE_PREFIX_PATH}" \
              -DTPL_ENABLE_PARMETISLIB=OFF \
              -DXSDK_ENABLE_Fortran=OFF \
              -DTPL_ENABLE_LAPACKLIB=ON &&
            cmake --build superlu_dist-build-dir/ &&
            sudo cmake --install superlu_dist-build-dir/ &&
            pip -v install $(python -c "import tomllib; deps=tomllib.load(open('dolfinx/python/pyproject.toml','rb'))['project']['dependencies']; print(' '.join(x for x in deps if 'fenics-basix' in x or 'fenics-ffcx' in x))") &&
            pip -v install wheel scikit-build-core nanobind &&
            PETSC_CONFIGURE_OPTIONS="--with-debugging=0 --with-fc=0
            --download-f2cblaslapack --with-superlu_dist-dir=/usr/local"
            pip -v wheel petsc -w $GITHUB_WORKSPACE/petsc-wheels &&
            pip -v install --no-index --find-links=$GITHUB_WORKSPACE/petsc-wheels petsc &&
            PETSC_DIR=$(python -c "import petsc; print(petsc.get_petsc_dir())")
            pip -v wheel petsc4py -w $GITHUB_WORKSPACE/petsc-wheels &&
            pip -v install --no-index --find-links=$GITHUB_WORKSPACE/petsc-wheels petsc4py &&
            for W in $GITHUB_WORKSPACE/petsc-wheels/petsc4py-*.whl; do
              rm -rf /tmp/p4p && wheel unpack $W -d /tmp/p4p &&
              install_name_tool -add_rpath @loader_path/../../petsc/lib $(find /tmp/p4p -name 'PETSc*.so') &&
              codesign --force --sign - $(find /tmp/p4p -name 'PETSc*.so') &&
              rm $W && wheel pack /tmp/p4p/petsc4py-* -d $GITHUB_WORKSPACE/petsc-wheels || exit 1;
            done &&
            cmake -G Ninja -S $GITHUB_WORKSPACE/dolfinx/cpp -B $GITHUB_WORKSPACE/dolfinx-build-dir/ \
              -DPython3_EXECUTABLE=$(which python) \
              -DCMAKE_CXX_FLAGS_INIT="-fexperimental-library" \
              -DCMAKE_PREFIX_PATH="$MPI_PREFIX;${CMAKE_PREFIX_PATH}" \
              -DDOLFINX_ENABLE_SCOTCH=ON \
              -DDOLFINX_ENABLE_PARMETIS=OFF \
              -DDOLFINX_ENABLE_SUPERLU_DIST=ON \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo &&
            cmake --build $GITHUB_WORKSPACE/dolfinx-build-dir/ &&
            sudo cmake --install dolfinx-build-dir/
          # As of 6/26 DOLFINx uses std::jthread which is only officially
          # supported in macOS SDK 26. -fexperimental-library enables
          # experimental std library support which allows the build to complete
          # on macOS SDK 15.
          CIBW_CONFIG_SETTINGS_LINUX: >
            cmake.args="-DCMAKE_PREFIX_PATH=/opt/python/cp312-cp312;/usr/local"
            wheel.py-api=cp312
            cmake.build-type="Release"
          CIBW_CONFIG_SETTINGS_MACOS: >
            cmake.args="-DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH;-DCMAKE_CXX_FLAGS_INIT=-fexperimental-library"
            wheel.py-api=cp312
            cmake.build-type="Release"
          CIBW_BUILD_FRONTEND: "build; args: -nx"
          # The project is copied into the Linux container, not mounted, so
          # the petsc wheels need a bind mount to survive back to the host.
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume=${{ github.workspace }}/petsc-wheels:/petsc-wheels"
          # The first line allows auditwheel to find and bundle in libbasix
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            export LD_LIBRARY_PATH=$(python -c "import site; print(site.getsitepackages()[0] + '/fenics_basix.libs')"):${LD_LIBRARY_PATH} &&
            python -m pip install --quiet wheel &&
            auditwheel repair --exclude libmpi.so* --exclude libpetsc.so* -w {dest_dir} {wheel} &&
            wheel unpack {dest_dir}/*.whl -d {dest_dir}/unpacked &&
            rm {dest_dir}/*.whl &&
            find {dest_dir}/unpacked -name "*.so*" -type f | xargs -I% patchelf --add-rpath '$ORIGIN/../petsc/lib' % &&
            bash /project/dolfinx/.github/scripts/restore-dolfinx-soname.sh {dest_dir}/unpacked/* &&
            wheel pack {dest_dir}/unpacked/* -d {dest_dir} &&
            pipx run abi3audit --verbose --strict --report {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-listdeps --depending {wheel} &&
            delocate-wheel --require-archs {delocate_archs} --exclude libmpi --exclude libpetsc -w {dest_dir} {wheel} &&
            wheel unpack {dest_dir}/*.whl -d {dest_dir}/unpacked &&
            rm {dest_dir}/*.whl &&
            find {dest_dir}/unpacked \( -name "*.so" -o -name "*.dylib" \) | while read -r f; do for dep in $(otool -L "$f" | awk '/libmpi\.[0-9]+\.dylib/{print $1}'); do install_name_tool -change "$dep" @rpath/$(basename "$dep") "$f"; done; done &&
            find {dest_dir}/unpacked \( -name "*.so" -o -name "*.dylib" \) | xargs -I% install_name_tool -add_rpath @loader_path/../petsc/lib % &&
            find {dest_dir}/unpacked \( -name "*.so" -o -name "*.dylib" \) | xargs -I% codesign --force --sign - % &&
            wheel pack {dest_dir}/unpacked/* -d {dest_dir} &&
            pipx run abi3audit --verbose --strict --report {wheel}
          CIBW_TEST_REQUIRES: pytest-xdist pytest-timeout
          CIBW_TEST_GROUPS: test
          CIBW_BEFORE_TEST_LINUX: >
            pip install mpich mpi4py &&
            pip install --no-index --find-links=/project/simple adios2 &&
            pip install --no-index --find-links=/petsc-wheels petsc petsc4py
          CIBW_BEFORE_TEST_MACOS: >
            pip install openmpi mpi4py &&
            pip install --no-index --find-links=$GITHUB_WORKSPACE/petsc-wheels petsc petsc4py
          CIBW_TEST_COMMAND_LINUX: >
            timeout -k 60 1800 python -m pytest -n auto -k "not test_mixed_system" {project}/dolfinx/python/test/unit &&
            timeout -k 60 1200 mpiexec -n 2 python -m pytest -v -k "not test_mixed_system" {project}/dolfinx/python/test/unit
          CIBW_TEST_COMMAND_MACOS: >
            export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib${DYLD_LIBRARY_FALLBACK_PATH:+:${DYLD_LIBRARY_FALLBACK_PATH}}" &&
            mpiexec -n 1 python -m pytest --timeout=900 --timeout-method=thread -n auto -m "not adios2" -k "not test_mixed_system" {project}/dolfinx/python/test/unit &&
            mpiexec -n 2 python -m pytest --timeout=900 --timeout-method=thread -m "not adios2" -k "not test_mixed_system" {project}/dolfinx/python/test/unit

      - name: Update temporary simple503 repository (Linux)
        if: runner.os == 'Linux'
        run: |
          cp wheelhouse/* simple
          cp petsc-wheels/petsc-*.whl petsc-wheels/petsc4py-*.whl simple
          cp petsc-wheels/scifem-*.whl simple 2>/dev/null || true
          python -m simple503 --base-url file:///shared simple

      - name: Update temporary simple503 repository (macOS)
        if: runner.os == 'macOS'
        run: |
          cp wheelhouse/* simple
          cp petsc-wheels/petsc-*.whl petsc-wheels/petsc4py-*.whl simple
          cp petsc-wheels/scifem-*.whl simple 2>/dev/null || true
          python -m simple503 --base-url "file://${GITHUB_WORKSPACE}/simple" simple

      - name: Upload simple503-test artifact
        uses: actions/upload-artifact@v7
        with:
          name: simple503-test-${{ matrix.os }}
          path: simple/*

      # The combined simple503 repository is assembled from the wheelhouse
      # artifacts, so the petsc wheels have to travel with them
      - name: Add the petsc wheels to the wheelhouse
        run: |
          cp petsc-wheels/petsc-*.whl petsc-wheels/petsc4py-*.whl wheelhouse/
          cp petsc-wheels/scifem-*.whl wheelhouse/ 2>/dev/null || true

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheelhouse-${{ matrix.os }}
          path: wheelhouse/*

      - name: Test in clean python image with pypi MPICH
        if: runner.os == 'Linux'
        run: >
          cd dolfinx &&
          sudo git clean -fdx && cd ../ &&
          docker run -v $(pwd)/dolfinx:/dolfinx -v $(pwd)/simple:/shared \
            --env PIP_INDEX_URL=file:///shared --env PIP_EXTRA_INDEX_URL=https://pypi.org/simple python:3.13 \
            /bin/bash -l -c "pip install --pre --group /dolfinx/python/pyproject.toml:test pytest-timeout mpich petsc adios2 'fenics-dolfinx[petsc4py]' && timeout -k 60 1200 mpiexec -n 2 python -m pytest -v -k 'not test_mixed_system' /dolfinx/python/test/unit"

      # Disabled on this branch: PETSc is built against the PyPI MPICH, and
      # its configure enables MPIX_STREAM because MPICH provides the enqueue
      # extensions. Intel MPI is MPICH ABI compatible but does not implement
      # them, so libpetsc fails to load with
      #   undefined symbol: MPIX_Irecv_enqueue
      # There is no configure flag to turn this off, it is a link test on
      # whatever MPI is present. One petsc wheel serving several MPIs is what
      # petsc!9516 and the MPI standard ABI are for, so revisit after 3.26.
      - name: Test in clean python image with pypi Intel MPI (x86_64 only)
        if: false && runner.os == 'Linux' && runner.arch == 'X64'
        run: >
          cd dolfinx &&
          sudo git clean -fdx && cd ../ &&
          docker run -v $(pwd)/dolfinx:/dolfinx -v $(pwd)/simple:/shared \
            --env PIP_INDEX_URL=file:///shared --env PIP_EXTRA_INDEX_URL=https://pypi.org/simple python:3.14 \
            /bin/bash -l -c "pip install --pre --group /dolfinx/python/pyproject.toml:test pytest-timeout impi-rt petsc 'fenics-dolfinx[petsc4py]' && timeout -k 60 1200 mpiexec -n 2 python -m pytest -v -m 'not adios2' -k 'not test_mixed_system' /dolfinx/python/test/unit"

      # Disabled on this branch: the petsc4py wheel is built for the Python
      # cibuildwheel uses, which is not the one this venv is created from.
      - name: Test in clean virtual environment with pypi OpenMPI (macOS)
        if: false && runner.os == 'macOS'
        run: |
          cd dolfinx && git clean -fdx && cd ../
          python -m venv venv-test
          source venv-test/bin/activate
          PIP_EXTRA_INDEX_URL="file://${GITHUB_WORKSPACE}/simple" pip install --group dolfinx/python/pyproject.toml:test pytest-timeout openmpi fenics-dolfinx
          which mpiexec
          mpiexec -n 2 python -m pytest --timeout=900 --timeout-method=thread -m "not adios2" dolfinx/python/test/unit

      - name: Update FEniCS Project simple503 repository
        run: |
          python -m simple503 --base-url http://packages.fenicsproject.org/simple simple

      - name: Upload simple503 artifact
        uses: actions/upload-artifact@v7
        with:
          name: simple503-${{ matrix.os }}
          path: simple/*

  combined_repository:
    name: Create combined simple503 repository
    needs: [build_adios2_wheels, build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7

      - name: Install Python dependencies
        run: python -m pip install simple503

      - name: Make shared wheel directory
        run: mkdir -p shared/

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheelhouse-*
          path: wheelhouse-artifacts/

      - name: Extract wheels into shared folder
        run: find wheelhouse-artifacts/ -name "*.whl" -exec cp {} shared/ \;

      - name: Build simple503 repository
        run: python -m simple503 --base-url http://packages.fenicsproject.org/simple-beta shared/

      - name: Upload combined repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: simple503-combined
          path: shared/*
